name: Update latest blog posts

on:
  schedule:
    - cron: "0 6 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest Syncfusion articles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest posts from the author page
        run: node .github/scripts/update-posts.mjs

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "blog-post-bot"
          git config user.email "blog-post-bot@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update latest Syncfusion articles"
          git push
