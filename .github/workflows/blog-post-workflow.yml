name: Update latest blog posts

on:
  schedule:
    - cron: "0 6 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with latest Syncfusion articles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update latest Syncfusion posts
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://www.syncfusion.com/blogs/author/ankit-sharma/feed"
          max_post_count: "5"
          commit_message: "docs: update latest Syncfusion articles"
          retry_count: "2"
          retry_wait_time: "5"
          enable_keepalive: "true"
